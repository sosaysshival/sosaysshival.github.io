<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SO SAYS SHIVAL</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f2f1ee; --paper2:#e4e2dd; --ink:#161514; --soft:#7a766f; --line:#bdbab3;
    --leaf1:#dbd19c; --leaf2:#c7bb82; --cream:#f3e9d2;
    --wood:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='w'><feTurbulence type='fractalNoise' baseFrequency='0.012 0.5' numOctaves='3' seed='5'/><feColorMatrix values='0 0 0 0 .2  0 0 0 0 .11  0 0 0 0 .05  0 0 0 1.1 -.15'/></filter><rect width='100%' height='100%' fill='%239a6a3c'/><rect width='100%' height='100%' filter='url(%23w)'/></svg>");
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:'Special Elite','Courier New',monospace;color:var(--ink);min-height:100vh;overflow-x:hidden;
    background:linear-gradient(var(--paper),var(--paper2));background-attachment:fixed}

  header{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;
    padding:12px 18px;background:var(--paper);border-bottom:1px solid var(--line)}
  .logo{font-size:16px;letter-spacing:3px;cursor:pointer;white-space:nowrap}
  #burger{width:44px;height:44px;border:0;background:transparent;display:flex;flex-direction:column;justify-content:center;gap:7px;padding:0 9px;cursor:pointer}
  #burger span{display:block;height:2px;background:var(--ink);transition:.25s}
  #burger.x span:nth-child(1){transform:translateY(9px) rotate(45deg)}
  #burger.x span:nth-child(2){opacity:0}
  #burger.x span:nth-child(3){transform:translateY(-9px) rotate(-45deg)}

  main{padding:8px 16px 40px;max-width:720px;margin:auto}
  .scene{max-width:430px;margin:0 auto}
  .scene svg{display:block;width:100%;height:auto}
  .cap{position:relative;max-width:430px;margin:12px auto 30px;padding:15px 16px;background:#f4e6a8;border:2.5px solid var(--ink);
    box-shadow:5px 5px 0 var(--ink);font-size:17px;line-height:1.5;text-align:center}
  .cap::before{content:"";position:absolute;top:-14px;left:calc(50% - 11px);border-left:11px solid transparent;border-right:11px solid transparent;border-bottom:14px solid var(--ink)}
  .cap::after{content:"";position:absolute;top:-9px;left:calc(50% - 8px);border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:10px solid #f4e6a8}
  h1{font-weight:400;font-size:clamp(24px,7.6vw,38px);letter-spacing:4px;text-align:center;line-height:1.2;padding:12px 0;
    border-top:3px double var(--ink);border-bottom:3px double var(--ink)}
  .tag{text-align:center;color:var(--ink);font-size:18px;margin:16px 0 26px;line-height:1.4}
  .warn{background:#fff;border:1px solid #b33;padding:10px;margin:14px 0;font-size:14px}

  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .tile{background:var(--wood);background-size:300px;color:var(--cream);border:0;border-radius:8px;padding:14px 12px;min-height:128px;
    text-align:left;cursor:pointer;font-family:inherit;box-shadow:0 2px 0 #5b3a1c,0 5px 10px rgba(0,0,0,.25),inset 0 0 0 2px rgba(0,0,0,.18);
    text-shadow:0 1px 0 rgba(0,0,0,.55);transition:transform .12s}
  .tile:active{transform:translateY(2px)}
  .tile .no{display:block;font-size:13px;opacity:.75;letter-spacing:3px}
  .tile b{display:block;font-weight:400;font-size:17px;line-height:1.25;margin:10px 0 8px}
  .tile i{display:block;font-style:normal;font-size:12px;opacity:.8}

  h2.sec{font-weight:400;font-size:clamp(22px,7vw,30px);line-height:1.25;margin:22px 0 6px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  .sub{color:var(--soft);font-size:15px;margin:8px 0 20px;line-height:1.4}

  .leaf{position:relative;margin:18px 0;padding:16px 34px;border-radius:10px;
    background:
      repeating-linear-gradient(0deg,rgba(100,88,35,.17) 0 1px,transparent 1px 7px),
      linear-gradient(90deg,var(--leaf2),var(--leaf1) 14%,var(--leaf1) 86%,var(--leaf2));
    box-shadow:0 1px 0 #a89c63,0 4px 8px rgba(0,0,0,.18);border:1px solid #b3a76c}
  .leaf::before,.leaf::after{content:"";position:absolute;top:50%;width:13px;height:13px;margin-top:-6px;border-radius:50%;
    background:var(--paper2);box-shadow:inset 1px 1px 2px rgba(0,0,0,.4)}
  .leaf::before{left:10px}.leaf::after{right:10px}
  .leaf .date{display:block;font-size:12px;letter-spacing:2px;color:#6b5d27;margin-bottom:6px}
  .leaf h3{font-weight:400;font-size:20px;line-height:1.3;margin-bottom:8px}
  .leaf p{font-size:16px;line-height:1.55;white-space:pre-wrap}
  .empty{color:var(--soft);margin:18px 0}
  .pic{display:block;width:100%;height:auto;margin:6px 0 12px;border:7px solid #f6f2e6;box-shadow:0 2px 6px rgba(0,0,0,.35);filter:sepia(.12)}
  .cbtn{margin-top:12px;background:transparent;border:1px solid var(--ink);border-radius:4px;font-family:inherit;font-size:13px;color:var(--ink);padding:7px 12px;cursor:pointer}
  .cwrap{background:#fbfaf7;border:1px solid var(--line);border-radius:8px;padding:10px;margin:-6px 0 18px}
  .cwrap[hidden]{display:none}
  .abtn{margin:12px 0 0 8px;background:transparent;border:1px solid var(--ink);border-radius:4px;font-family:inherit;font-size:13px;color:var(--ink);padding:7px 12px;cursor:pointer}
  .ed-overlay{position:fixed;inset:0;z-index:80;background:rgba(40,35,30,.6);display:none;overflow-y:auto;padding:12px}
  .ed-overlay.open{display:block}
  .ed{max-width:560px;margin:16px auto;background:var(--paper);border:2px solid var(--ink);border-radius:8px;padding:16px;box-shadow:6px 6px 0 var(--ink)}
  .ed h4{font-weight:400;font-size:20px;margin-bottom:6px}
  .ed label{display:block;font-size:12px;color:var(--soft);margin:14px 0 4px;letter-spacing:2px}
  .ed input[type=text],.ed input[type=password],.ed select,.ed textarea{width:100%;font-family:inherit;font-size:16px;padding:10px;border:1px solid var(--ink);background:#fff;border-radius:4px;color:var(--ink)}
  .ed textarea{min-height:240px;line-height:1.5;resize:vertical}
  .ed .row{display:flex;gap:10px;margin-top:16px}
  .ed button{font-family:inherit;font-size:15px;padding:11px 16px;border:2px solid var(--ink);border-radius:4px;cursor:pointer;background:transparent;color:var(--ink)}
  .ed button.pri{background:var(--ink);color:var(--paper)}
  .ed .msg{font-size:14px;margin-top:12px;min-height:20px;line-height:1.4}
  .ed .thumbs img{width:64px;height:64px;object-fit:cover;margin:8px 8px 0 0;border:2px solid var(--ink)}
  .back{margin-top:10px;background:transparent;border:1px solid var(--ink);font-family:inherit;font-size:14px;color:var(--ink);
    padding:10px 16px;border-radius:4px;cursor:pointer}

  #dim{position:fixed;inset:0;background:rgba(40,35,30,.4);z-index:45;display:none}
  #dim.open{display:block}
  nav{position:fixed;top:0;right:0;bottom:0;width:min(86vw,340px);z-index:50;padding:80px 16px 24px;overflow-y:auto;
    background:var(--wood);background-size:300px;box-shadow:-6px 0 22px rgba(0,0,0,.35),inset 8px 0 14px -8px rgba(0,0,0,.5);
    transform:translateX(105%);transition:transform .3s ease}
  nav.open{transform:none}
  nav button{display:block;width:100%;text-align:left;margin:12px 0;padding:14px 30px;font-family:inherit;font-size:16px;color:var(--ink);cursor:pointer;
    border-radius:8px;border:1px solid #b3a76c;position:relative;min-height:50px;
    background:repeating-linear-gradient(0deg,rgba(100,88,35,.17) 0 1px,transparent 1px 7px),linear-gradient(90deg,var(--leaf2),var(--leaf1) 14%,var(--leaf1) 86%,var(--leaf2));
    box-shadow:0 3px 6px rgba(0,0,0,.35)}
  nav button:active{transform:translateY(2px)}
  nav button::before{content:"";position:absolute;left:9px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:#6b4527;box-shadow:inset 1px 1px 2px rgba(0,0,0,.6)}

  .typing::after{content:"\258D";margin-left:1px;animation:blink .7s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  footer{text-align:center;color:var(--soft);font-size:12px;padding:10px 16px 40px;letter-spacing:1px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="logo" id="siteName">SO SAYS SHIVAL</div>
  <button id="burger" aria-label="Menu"><span></span><span></span><span></span></button>
</header>

<div id="dim"></div>
<nav id="menu"></nav>

<main><div id="view"></div></main>
<footer>written by hand, updated daily<br><a href="#" id="wr" style="color:inherit">&#9998; write</a></footer>

<script src="content.js"></script>
<script>
  const TITLE = "SO SAYS SHIVAL";
  const TAGLINE = "Bolo Vats! What's up? Anything new?";
  const QUOTE = "Problems are overrated. Permanence is eternal. Faith transcends all of us, and there is only one GOAT: HUMANITY.";

  // COMMENTS (giscus). Paste the two values from giscus.app between the quotes.
  const GISCUS = {
    repo: "sosaysshival/sosaysshival.github.io",
    repoId: "",
    category: "Announcements",
    categoryId: ""
  };

  const HAS = (typeof CONTENT !== 'undefined');
  const BASE = HAS ? CONTENT : {};
  let DATA = {};
  let ENTRIES = [];
  function rebuild(){
    DATA = {};
    KEYS.forEach(k=>{DATA[k] = ENTRIES.filter(e=>e.section===k).concat(BASE[k]||[])});
  }
  const META = {
    notfamous:{n:"Not Famous",no:"i",sub:"People and places the world forgot to notice."},
    underrated:{n:"Low key underrated stuff",no:"ii",sub:"Quiet things that deserve more attention."},
    projects:{n:"Project under work",no:"iii",sub:"Work in progress."},
    blogs:{n:"Backchodi urf Blogs",no:"iv",sub:"Unfiltered thoughts."},
    reading:{n:"What I read today",no:"v",sub:"Today's reading."},
    gyaan:{n:"Gyaan becho",no:"vi",sub:"Lessons, freely shared."}
  };
  const KEYS = Object.keys(META);
  const $ = id => document.getElementById(id);
  const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const sleep = ms => new Promise(r=>setTimeout(r,ms));
  let skip = false;

  // typewriter
  async function typeAll(root, speed){
    const tok = (root._tok = (root._tok||0)+1);
    skip = false;
    const els = [...root.querySelectorAll('[data-t]')];
    els.forEach(e=>{e.dataset.full = e.textContent; e.textContent='';});
    if(reduce){els.forEach(e=>e.textContent=e.dataset.full);return}
    for(const e of els){
      const full = e.dataset.full;
      const sp = full.length>150 ? Math.min(speed,6) : speed;
      e.classList.add('typing');
      for(let i=0;i<full.length;i++){
        if(root._tok!==tok) return;
        if(skip){e.textContent=full;break}
        e.textContent = full.slice(0,i+1);
        await sleep(sp);
      }
      e.textContent = full;
      e.classList.remove('typing');
    }
  }
  addEventListener('pointerdown',()=>{skip=true});

  // menu
  $('menu').innerHTML = '<button data-k="home"><span data-t>Home</span></button>' +
    KEYS.map(k=>`<button data-k="${k}"><span data-t>${esc(META[k].n)}</span></button>`).join('');
  function toggle(open){
    $('menu').classList.toggle('open',open);$('dim').classList.toggle('open',open);$('burger').classList.toggle('x',open);
    if(open) typeAll($('menu'),12);
  }
  $('burger').onclick = () => toggle(!$('menu').classList.contains('open'));
  $('dim').onclick = () => toggle(false);
  $('siteName').onclick = () => go('home');
  document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.k));

  // radiating burst behind the hero
  function rays(){
    let s='';const n=32,cx=200,cy=300,R=520;
    for(let i=0;i<n;i+=2){
      const a=i*2*Math.PI/n,b=(i+1)*2*Math.PI/n;
      s+=`<polygon points="${cx},${cy} ${(cx+R*Math.cos(a)).toFixed(1)},${(cy+R*Math.sin(a)).toFixed(1)} ${(cx+R*Math.cos(b)).toFixed(1)},${(cy+R*Math.sin(b)).toFixed(1)}"/>`;
    }
    return s;
  }

  // classic ink-and-halftone illustration
  const SCENE = `
  <svg viewBox="0 0 400 420" role="img" aria-label="Ink illustration of a seated monk in sunglasses before a mountain monastery">
    <defs>
      <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
        <circle cx="3" cy="3" r="1.5" fill="#161514"/>
      </pattern>
      <pattern id="dotsL" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
        <circle cx="3.5" cy="3.5" r="1" fill="#161514"/>
      </pattern>
      <path id="mt" d="M0 215L50 150L80 175L130 108L190 192L240 138L300 200L350 158L400 208L400 242L0 242Z"/>
      <g id="mo">
        <path d="M118 118C100 132 88 172 84 216C78 252 48 272 42 306C58 336 108 346 150 346C192 346 242 336 258 306C252 272 222 252 216 216C212 172 200 132 182 118C166 112 134 112 118 118Z"/>
        <path d="M124 80C124 54 138 46 150 46C162 46 176 54 176 80C176 102 166 118 150 120C134 118 124 102 124 80Z"/>
        <path d="M122 276C122 264 142 258 160 264C176 268 176 284 160 288C142 292 122 288 122 276ZM146 280C150 270 172 268 184 276C190 284 176 292 160 292C150 292 144 286 146 280Z"/>
      </g>
      <g id="mi">
        <path d="M124 80C116 80 115 92 123 98M176 80C184 80 185 92 177 98"/>
        <path d="M130 73C136 69 144 69 148 72M152 72C156 69 164 69 170 73"/>
        <path d="M150 90C148 98 146 101 148 103C150 104 153 104 155 103"/>
        <path d="M141 109C147 112 156 111 161 106"/>
        <path d="M139 116L137 130M161 116L163 130M126 121C138 140 150 150 150 150C150 150 162 140 174 121"/>
        <path d="M120 120C138 160 172 210 214 246M132 122C148 156 178 200 214 232"/>
        <path d="M122 150C114 190 118 240 128 272M178 150C186 190 182 240 172 272"/>
        <path d="M104 170C108 196 106 222 98 246M196 168C194 200 198 226 206 250"/>
        <path d="M60 300C88 286 118 284 140 292M240 300C212 286 182 284 160 292M80 322C110 316 130 318 150 324M220 322C190 316 170 318 150 324"/>
        <path d="M150 266C154 258 162 258 166 264"/>
      </g>
    </defs>

    <!-- burst -->
    <g fill="#161514" opacity=".09">${rays()}</g>

    <!-- mountains -->
    <use href="#mt" fill="#e4e0d6" stroke="#161514" stroke-width="1.6" stroke-linejoin="round"/>
    <use href="#mt" fill="url(#dotsL)" opacity=".55"/>
    <path d="M0 238C80 222 160 240 240 232C320 224 360 236 400 230" fill="none" stroke="#161514" stroke-width="1.6"/>

    <!-- monastery -->
    <g stroke="#161514" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round">
      <path d="M110 232V176H290V232Z" fill="#efe9d9"/>
      <path d="M130 176V152H270V176Z" fill="#efe9d9"/>
      <path d="M166 152V130H234V152Z" fill="#efe9d9"/>
      <path d="M100 179L118 165H282L300 179Z" fill="#8a2a2a"/>
      <path d="M124 153L140 141H260L276 153Z" fill="#8a2a2a"/>
      <path d="M160 131L176 115H224L240 131Z" fill="#c9972e"/>
      <path d="M200 115V97M195 97H205" fill="none"/>
      <path d="M135 192L139 214H149L153 192ZM165 192L169 214H179L183 192ZM217 192L221 214H231L235 192ZM247 192L251 214H261L265 192Z" fill="#161514"/>
      <path d="M190 232V204C190 194 210 194 210 204V232Z" fill="#161514"/>
      <path d="M96 234H304M88 240H312" fill="none"/>
      <path d="M333 232V214H367V232Z" fill="#efe9d9"/>
      <path d="M337 214C340 190 360 190 363 214Z" fill="#fbf8ef"/>
      <path d="M350 192V170M345 178H355" fill="none" stroke="#c9972e" stroke-width="2.4"/>
    </g>

    <!-- halo ring -->
    <circle cx="200" cy="292" r="128" fill="none" stroke="#c9972e" stroke-width="5" stroke-dasharray="760 44" transform="rotate(-60 200 292)"/>
    <circle cx="200" cy="292" r="121" fill="none" stroke="#161514" stroke-width="1.2" stroke-dasharray="740 22" transform="rotate(-60 200 292)"/>

    <!-- ground -->
    <ellipse cx="200" cy="408" rx="104" ry="8" fill="#161514" opacity=".18"/>
    <path d="M70 410C150 416 250 416 330 410" fill="none" stroke="#161514" stroke-width="2.4" stroke-linecap="round"/>

    <!-- monk -->
    <g transform="translate(88 148) scale(.75)">
      <!-- flat colour -->
      <path d="M118 118C100 132 88 172 84 216C78 252 48 272 42 306C58 336 108 346 150 346C192 346 242 336 258 306C252 272 222 252 216 216C212 172 200 132 182 118C166 112 134 112 118 118Z" fill="#e08a1e"/>
      <path d="M60 300C90 272 120 268 150 276C180 268 212 272 240 300C230 330 190 342 150 342C110 342 70 330 60 300Z" fill="#7b2330"/>
      <path d="M176 124C206 108 236 118 262 98C256 124 236 140 208 146C226 152 244 160 258 176C230 176 202 164 180 144Z" fill="#8a2a2a" stroke="#161514" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M190 130C214 130 234 128 250 114" fill="none" stroke="#161514" stroke-width="1.2"/>
      <path d="M124 80C124 54 138 46 150 46C162 46 176 54 176 80C176 102 166 118 150 120C134 118 124 102 124 80Z" fill="#d9a07a"/>
      <path d="M122 276C122 264 142 258 160 264C176 268 176 284 160 288C142 292 122 288 122 276ZM146 280C150 270 172 268 184 276C190 284 176 292 160 292C150 292 144 286 146 280Z" fill="#d9a07a"/>
      <!-- halftone shadow -->
      <path d="M182 118C200 132 212 172 216 216C222 252 252 272 258 306C250 330 200 344 170 346C186 300 192 240 182 118Z" fill="url(#dots)" opacity=".5"/>
      <path d="M162 70C172 76 176 90 172 104C168 112 160 116 152 118C166 108 168 86 162 70Z" fill="url(#dots)" opacity=".5"/>
      <path d="M134 112C142 122 158 122 166 112L166 121C158 129 142 129 134 121Z" fill="url(#dots)" opacity=".6"/>
      <!-- ink -->
      <use href="#mo" fill="none" stroke="#161514" stroke-width="2.8" stroke-linejoin="round"/>
      <use href="#mi" fill="none" stroke="#161514" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- sunglasses -->
      <g fill="#0c0c0c" stroke="#161514" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
        <path d="M128 76H149V84C149 91 144 94 138 94C132 94 128 89 128 82Z"/>
        <path d="M151 76H172V82C172 89 168 94 162 94C156 94 151 91 151 84Z"/>
        <path d="M149 78H151" fill="none"/>
        <path d="M128 78L121 77M172 78L179 77" fill="none"/>
      </g>
      <path d="M132 80L139 80M155 80L162 80" stroke="#fff" stroke-width="1.8" stroke-linecap="round" opacity=".7"/>
    </g>
  </svg>`;

  function home(){
    const tiles = KEYS.map(k=>{
      const items = DATA[k]||[];
      return `<button class="tile" data-k="${k}"><span class="no">${META[k].no}.</span><b>${esc(META[k].n)}</b><i>${items.length} ${items.length===1?'entry':'entries'}</i></button>`;
    }).join('');
    return `${HAS?'':'<div class="warn">content.js was not found. Check that the file is named exactly content.js (no extra s) in the same folder as index.html.</div>'}
      <div class="scene">${SCENE}</div>
      <div class="cap" data-t>${esc(QUOTE)}</div>
      <h1 data-t>${esc(TITLE)}</h1>
      <div class="tag" data-t>${esc(TAGLINE)}</div>
      <div class="tiles">${tiles}</div>`;
  }
  function section(k){
    const items = DATA[k]||[];
    const cards = items.length ? items.map((i,n)=>{
      const t = n<3 ? ' data-t' : '';
      const pics = [].concat(i.img||[]).map(p=>`<img class="pic" src="${esc(p)}" alt="${esc(i.title)}" loading="lazy">`).join('');
      const term = esc(i.id || (k+':'+i.date+':'+i.title));
      return `<div class="leaf"><span class="date"${t}>${esc(i.date)}</span><h3${t}>${esc(i.title)}</h3>${pics}<p${t}>${esc(i.text)}</p><button class="cbtn" data-term="${term}">&#9998; comments</button>${adminBtns(i)}</div><div class="cwrap" hidden></div>`;
    }).join('') : '<p class="empty">Nothing written here yet.</p>';
    return `<h2 class="sec" data-t>${esc(META[k].n)}</h2><p class="sub">${esc(META[k].sub)}</p>${cards}
      <button class="back" onclick="go('home')">&larr; back</button>`;
  }
  function toggleComments(btn){
    const box = btn.closest('.leaf').nextElementSibling;
    if(!box.hidden){box.hidden = true;return}
    box.hidden = false;
    if(box.dataset.ready) return;
    box.dataset.ready = '1';
    if(!GISCUS.repoId || !GISCUS.categoryId){
      box.innerHTML
